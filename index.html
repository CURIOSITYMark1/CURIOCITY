.pt{margin:4px 2px 8px}

.btn{font-size:15px;min-height:44px;padding:11px 20px}

}

function card(m, hero, ico) {

  const C = S.data.comments.filter(c => c.moment_id === m.id && visible(c.user_id)), o = S.open[m.id];
  const cms = o ? `<div class="cms">${C.map(c => { const q = pOf(c.user_id); return `<div class="cm"><b style="color:${cl(q.color)}">${esc(q.username)}</b>${gold(c.user_id)} ${cbody(c)}${S.me && c.user_id === S.me.id ? del("c", c.id) : ""}</div>`; }).join("")}</div>` : "";
  const more = !o && C.length ? `<button class="more" data-a="cm" data-id="${m.id}">Ver ${C.length} comentario${C.length > 1 ? "s" : ""}</button>` : "";
  const cnt = k => L.filter(l => (l.kind || "heart") === k).length;
  const tp = REACT.map(([k, e]) => [e, cnt(k)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]).join("");
  const tray = S.rx === m.id ? `<div class="tray">${REACT.map(([k, e]) => `<button class="${mine === k ? "on" : ""}" data-a="like" data-id="${m.id}" data-k2="${k}" aria-label="Reaccionar ${k}"><span>${e}</span><small>${cnt(k) || ""}</small></button>`).join("")}</div>` : "";
  return `<article class="card ${hero ? "hero" : ""}">${hero ? `<span class="tag">${ic(ico || "trophy", 16)}${hero}</span>` : ""}<div class="who" ${hero ? 'style="margin-top:10px"' : ""}>${avatar(p)}<div><b style="color:${cl(p.color)}">${esc(p.username)}</b>${gold(m.user_id)}<small>${ago(m.created_at)}${REL[p.relationship] ? " · " + REL[p.relationship] : ""}</small></div>${introOn(p) ? `<button class="mini" data-a="play" data-u="${safe(p.intro_url)}">${ic("music", 14)}Presentación</button>` : ""}${S.me && m.user_id === S.me.id ? del("m", m.id) : ""}</div>${safe(m.image_url) ? `<img class="pic" loading="lazy" alt="Foto del momento" src="${safe(m.image_url)}" data-a="lb" data-u="${safe(m.image_url)}">` : ""}${safe(m.audio_url) ? (m.kind === "music" ? `<div class="note-card" style="--cc:${cl(p.color)}"><span class="nt">${ic("music", 24)}</span><div><b>${esc(m.audio_title || "Canción")}</b><small>Nota musical</small>${ap(m.audio_url, "w")}</div></div>` : `<div class="voice">${ap(m.audio_url)}</div>`) : ""}${m.text ? `<p>${esc(m.text)}</p>` : '<div style="height:10px"></div>'}<div class="acts"><button class="${mine ? "on" : ""} ${S.pop === m.id ? "bump" : ""}" data-a="rx" data-id="${m.id}" aria-label="Reaccionar">${tp || ic("heart", 18)}${L.length || ""}</button><button data-a="cm" data-id="${m.id}">${ic("chat", 18)}${C.length}</button></div>${tray}${more}${cms}${chatbar(m.id)}</article>`;
}

function particles() {

  const draw = () => {
    cx.clearRect(0, 0, W, H); cx.lineWidth = 1;
    for (const p of P) {
      if (!still) { p.x += p.vx; p.y += p.vy; p.r += p.vr; if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; } if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20; }
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = p.a; cx.strokeStyle = p.c;
      cx.beginPath(); cx.moveTo(0, -p.s); cx.lineTo(p.s * .87, p.s * .5); cx.lineTo(-p.s * .87, p.s * .5); cx.closePath(); cx.stroke(); cx.restore();
    }
  };
  const count = m => Math.round((W < 600 ? 55 : 110) * m);
  size(); P = Array.from({ length: count(1) }, make); draw();
  let lw = innerWidth; addEventListener("resize", () => { if (innerWidth !== lw) { lw = innerWidth; size(); draw(); } });
  if (!still) { let last = 0; const loop = t => { if (!document.hidden && cv.style.display !== "none" && t - last > 33) { last = t; draw(); } requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  return { set(m) { if (m === cur) return; cur = m; const n = count(m); while (P.length < n) P.push(make()); P.length = Math.min(P.length, n); draw(); } };
}
