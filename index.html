<style>

.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}label.btn{cursor:pointer}.btn.ghost.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px}.seg button{border:0;background:none;border-radius:9px;padding:10px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}.err{color:var(--bad);font-weight:600;font-size:14px}.pw{position:relative}.pw input{padding-right:84px}.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--prid);font-weight:600;padding:8px}

@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}

.sheet{animation:fade .2s}.sheet>div{animation:slide .28s cubic-bezier(.2,.9,.3,1)}
#toast{animation:tin .22s ease-out}
button,label.btn{transition:transform .12s,background .2s,color .2s,box-shadow .2s}
button:active:not(:disabled),label.btn:active{transform:scale(.95)}
.pw button:active:not(:disabled){transform:translateY(-50%)}

.tray button:hover span{transform:scale(1.25)}
.tray button small{font-size:11px;color:var(--mut);min-height:14px}
.tray button.on{background:var(--card);box-shadow:inset 0 0 0 2px var(--pri)}
.acts button.bump{animation:bump .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
nav button{position:relative}
.dot{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:11px;font-style:normal;border-radius:999px;min-width:16px;padding:0 4px;line-height:16px}
.note-card{display:flex;gap:12px;align-items:center;border-radius:14px;padding:14px;margin-top:10px;color:#fff}
.note-card small{display:block;opacity:.85}.note-card audio{width:100%;margin-top:8px}.note-card>div{flex:1;min-width:0}
.nt{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.voice audio{width:100%;margin-top:10px}
.stk{width:96px;height:96px;object-fit:cover;border-radius:16px;display:block;margin-top:4px}
.tray img{width:64px;height:64px;border-radius:12px;object-fit:cover;display:block}
.mini{background:var(--soft);color:var(--prid);border:0;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;display:inline-flex;gap:5px;align-items:center;margin-left:auto}
.prev{position:relative;margin-top:8px}.prev img{width:100%;max-height:240px;object-fit:cover;border-radius:12px}
.prev button{position:absolute;top:8px;right:8px;background:rgba(15,23,42,.75);color:#fff;border:0;border-radius:50%;width:32px;height:32px}
</style>

};
const ic = (n, s = 22, f) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

};

async function shrink(file, max, q) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("No se pudo leer esa imagen")); i.src = url; });
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", q));
}
const toData = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });

function mkDemo() {
  const K = "momentos_demo2"; let s;
  try { s = JSON.parse(localStorage.getItem(K)); } catch (e) {}
  if (!s) {
    const n = Date.now();
    s = { n: 10, me: null, comments: [], likes: [{ moment_id: 1, user_id: "u2" }],

  const find = n => s.users.find(u => u.username.toLowerCase() === n.toLowerCase());
  const meU = () => s.users.find(u => u.id === s.me);
  const deny = () => { throw new Error("Tu cuenta no tiene permiso para esto"); };
  return {
    demo: true,
    async session() { const u = meU(); return u ? { id: u.id, username: u.username } : null; },
    async signUp(n, p) { if (find(n)) throw new Error("Ese nombre ya existe"); const u = { id: "u" + (++s.n), username: n, pass: p, color: COLORS[4][1], avatar: "a1", status: "active" }; s.users.push(u); s.me = u.id; save(); },

    async friendAccept(id) { s.friends.find(f => f.id === id).status = "accepted"; save(); },
    async friendDel(id) { s.friends = s.friends.filter(f => f.id !== id); save(); },

  };
}

  };
}

async function wavTrim(blob, max) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let buf; try { buf = await ctx.decodeAudioData(await blob.arrayBuffer()); } catch (e) { throw new Error("No se pudo leer ese audio"); } finally { ctx.close(); }
  const rate = 16000, secs = Math.min(buf.duration, max), n = Math.floor(secs * rate);
  const off = new OfflineAudioContext(1, n, rate), src = off.createBufferSource();
  src.buffer = buf; src.connect(off.destination); src.start(0);
  const out = (await off.startRendering()).getChannelData(0);
  const v = new DataView(new ArrayBuffer(44 + n * 2)), w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, out[i])) * 32767, true);
  return { blob: new Blob([v], { type: "audio/wav" }), trimmed: buf.duration > max + .5 };
}
async function setAudio(blob, max, target, kind, title) {
  const r = await wavTrim(blob, max), o = { blob: r.blob, prev: await toData(r.blob), kind, title: title || "" };
  if (target === "intro") S.ia = o; else { S.aud = o; S.img = null; }
  if (r.trimmed) toast("Se recortó a " + max + " segundos");
}
async function startRec(max, target) {
  if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error("Tu navegador no permite grabar audio");
  let st; try { st = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { throw new Error("No se pudo usar el micrófono. Revisa el permiso del navegador."); }
  const mr = new MediaRecorder(st), ch = [], t0 = Date.now();
  mr.ondataavailable = e => ch.push(e.data);
  mr.onstop = async () => { clearInterval(REC.iv); st.getTracks().forEach(x => x.stop()); REC = null; S.rec = null; try { await setAudio(new Blob(ch), max, target, "audio"); } catch (e) { toast(e.message); } render(); };
  REC = { mr, iv: setInterval(() => { const n = Math.floor((Date.now() - t0) / 1e3), el = $("#rt"); if (el) el.textContent = fmt(n) + " / " + fmt(max); if (n >= max && mr.state === "recording") mr.stop(); }, 250) };
  mr.start(); S.rec = target; render();
}
async function sticker(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("No se pudo leer esa imagen")); i.src = url; });
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const k = Math.max(256 / img.width, 256 / img.height), w = img.width * k, h = img.height * k;
  c.getContext("2d").drawImage(img, (256 - w) / 2, (256 - h) / 2, w, h); URL.revokeObjectURL(url);
  return new Promise(ok => c.toBlob(ok, "image/png"));
}

  return `<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>Usuarios totales</span><b style="font-size:28px">${Object.keys(S.data.profiles).length}</b></div><h2>Perfiles</h2>` + (us.map(u => `<div class="item">${avatar(u, "sm")}<div><b style="color:${cl(u.color)}">${esc(u.username)}</b> ${u.status !== "active" ? `<span class="chip bad">${STAT[u.status]}</span>` : ""}</div><select data-st="${u.id}" aria-label="Estado de ${esc(u.username)}">${Object.entries(STAT).map(([k, v]) => `<option value="${k}" ${u.status === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>`).join("") || '<div class="empty">Aún no hay otros perfiles.</div>')
    + `<h2>Comentarios</h2>` + (cms.map(c => `<div class="item"><div><b>${esc(pOf(c.user_id).username)}</b>: ${esc(c.text)}</div>${del("c", c.id)}</div>`).join("") || '<div class="empty">Sin comentarios.</div>')
    + `<h2>Momentos</h2>` + (ms.map(m => `<div class="item">${safe(m.image_url) ? `<img class="thumb" alt="" src="${safe(m.image_url)}">` : ""}<div>${m.pinned_until > Date.now() ? '<span class="chip">Fijado</span> ' : ""}<b>${esc(pOf(m.user_id).username)}</b>: ${esc(m.text || "(solo foto)")}</div><select data-pin="${m.id}" aria-label="Fijar momento"><option value="">Fijar…</option><option value="1">1 hora</option><option value="24">1 día</option><option value="168">7 días</option>${m.pinned_until > Date.now() ? '<option value="0">Quitar</option>' : ""}</select>${del("m", m.id)}</div>`).join("") || '<div class="empty">Sin momentos.</div>');
}

function authSheet() {
  const up = S.auth === "up";
  return `<div class="sheet" data-a="close"><div data-stop="1"><div class="seg"><button data-a="auth" data-m="in" class="${up ? "" : "on"}">Entrar</button><button data-a="auth" data-m="up" class="${up ? "on" : ""}">Crear cuenta</button></div><h2 style="margin:6px 0 0">${up ? "Crea tu cuenta en segundos" : "Qué bueno verte de nuevo"}</h2><small style="color:var(--mut)">${up ? "Solo necesitas un apodo y una contraseña. Los demás verán tu apodo, así que mejor no uses tu nombre real." : "Escribe tu apodo y tu contraseña."}</small><input id="u" data-k="au" placeholder="Tu apodo" autocapitalize="none" autocomplete="username" maxlength="20" value="${esc(S.dr.au || "")}"><div class="pw"><input id="p" data-k="ap" type="${S.spw ? "text" : "password"}" placeholder="Contraseña (mínimo 6)" autocomplete="${up ? "new-password" : "current-password"}" value="${esc(S.dr.ap || "")}"><button data-a="spw">${S.spw ? "Ocultar" : "Mostrar"}</button></div>${S.err ? `<div class="err">${esc(S.err)}</div>` : ""}<button class="btn" data-a="go">${up ? "Crear mi cuenta" : "Entrar"}</button></div></div>`;
}

function render() {
  setTimeout(() => { S.pop = null; });
  const p = meP();
  $("#bar").innerHTML = (API.demo ? '<span class="chip">Modo demo</span> ' : "") + (S.me ? `<span style="font-weight:600;display:inline-flex;gap:8px;align-items:center">${avatar(p, "sm")}${esc(S.me.username)}</span>` : '<button class="btn" data-a="auth" data-m="in">Entrar</button>');
  const T = [["home", "home", "Inicio"], ["top", "trophy", "Destacado"], ["friends", "users", "Amistad"], ["me", "user", "Perfil"]];
  if (isAdmin()) T.push(["admin", "shield", "Admin"]);
  const nreq = S.me ? S.data.friends.filter(f => f.status === "pending" && f.addressee === S.me.id).length : 0;
  $("#nav").innerHTML = T.map(t => `<button data-a="tab" data-t="${t[0]}" class="${S.tab === t[0] ? "on" : ""}">${ic(t[1], 22)}${t[2]}${t[0] === "friends" && nreq ? `<i class="dot">${nreq}</i>` : ""}</button>`).join("");
  $("#main").className = S.fresh ? "go" : ""; S.fresh = false;
  $("#main").innerHTML = S.tab === "home" ? home() : S.tab === "top" ? rank("Momento destacado", 0) : S.tab === "friends" ? friends() : S.tab === "admin" ? admin() : prof();
  $("#auth").innerHTML = S.auth ? authSheet() : S.lb ? `<div class="sheet" data-a="lbx" style="align-items:center"><img src="${S.lb}" alt="Foto ampliada" style="max-width:96%;max-height:90vh;border-radius:12px"></div>` : "";
}

async function refresh() { try { S.data = await API.load(); } catch (e) { toast(e.message); } render(); }
const needLogin = () => { if (!S.me) { S.auth = "in"; render(); return true; } return false; };

document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.k; if (k) S.dr[k] = e.target.value; if (k === "fq" && $("#fres")) $("#fres").innerHTML = fres(); });

document.addEventListener("change", async e => {
  const t = e.target;
  try {
    if (t.dataset.st) { await API.setStatus(t.dataset.st, t.value); await refresh(); toast("Perfil actualizado"); }
    else if (t.dataset.pin) { if (t.value === "") return; await API.pin(+t.dataset.pin, +t.value); await refresh(); toast(+t.value ? "Momento fijado" : "Fijado quitado"); }
    else if (t.id === "idur") S.idur = t.value;
    else if (t.id === "fm" || t.id === "fi") { const f = t.files[0]; t.value = ""; if (!f) return; await setAudio(f, t.id === "fm" ? 60 : 30, t.id === "fm" ? "post" : "intro", t.id === "fm" ? "music" : "audio", f.name.replace(/\.[^.]+$/, "")); render(); }
    else if (t.id === "fs") { const f = t.files[0]; t.value = ""; if (!f || needLogin()) return; const url = await API.upload(await sticker(f), "png", "image/png"); await API.addSticker(url); await refresh(); toast("Sticker creado"); }
    else if (t.id === "f" || t.id === "fa") {
      const f = t.files[0]; t.value = ""; if (!f) return;
      const b = await shrink(f, t.id === "f" ? 1280 : 320, .8), d = await toData(b);
      if (t.id === "f") { S.img = { blob: b, prev: d }; S.aud = null; } else { S.pf = S.pf || {}; S.pf.blob = b; S.pf.url = d; }
      render();
    }
  } catch (x) { toast(x.message || "Algo salió mal"); }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  if (b.dataset.a === "close" && e.target.closest("[data-stop]")) return;
  const a = b.dataset.a, id = +b.dataset.id;
  try {
    if (a === "tab") { S.tab = b.dataset.t; S.pf = null; S.arm = null; S.fresh = true; S.rx = null; render(); scrollTo(0, 0); }
    else if (a === "auth") { S.auth = b.dataset.m; S.err = null; render(); }
    else if (a === "spw") { S.spw = !S.spw; render(); }
    else if (a === "close") { S.auth = null; render(); }
    else if (a === "lb") { S.lb = b.dataset.u; render(); }
    else if (a === "lbx") { S.lb = null; render(); }
    else if (a === "go") {
      const u = ($("#u").value || "").trim(), p = $("#p").value || ""; S.dr.au = u; S.dr.ap = p;
      if (!/^[A-Za-z0-9_]{3,20}$/.test(u)) { S.err = "El apodo debe tener 3 a 20 letras, números o _ (sin espacios)"; return render(); }
      if (p.length < 6) { S.err = "La contraseña necesita mínimo 6 caracteres"; return render(); }
      try { S.auth === "up" ? await API.signUp(u, p) : await API.signIn(u, p); } catch (e) { S.err = e.message; return render(); }
      S.err = null; S.dr.ap = ""; S.me = await API.session(); S.auth = null; S.pf = null; await refresh(); toast("Bienvenido, " + S.me.username);
    }
    else if (a === "out") { await API.signOut(); S.me = null; S.pf = null; S.tab = "home"; render(); }
    else if (a === "pick") $("#f").click();
    else if (a === "pickav") $("#fa").click();
    else if (a === "noimg") { S.img = null; render(); }
    else if (a === "post") {
      const t = (S.dr.post || "").trim(); if (!t && !S.img && !S.aud) return toast("Escribe algo o agrega una foto o un audio");
      b.disabled = true; const url = S.img ? await API.upload(S.img.blob) : null;
      let ex = null;
      if (S.aud) ex = { kind: S.aud.kind, audio_title: S.aud.kind === "music" ? (S.dr.mt || "Mi canción").slice(0, 60) : null, audio_url: await API.upload(S.aud.blob, "wav", "audio/wav") };
      await API.post(t, url, ex); S.dr.post = ""; S.dr.mt = ""; S.img = null; S.aud = null; await refresh(); toast("Momento publicado");
    }
    else if (a === "noaud") { S.aud = null; render(); }
    else if (a === "rec") { if (needLogin()) return; await startRec(b.dataset.t === "intro" ? 30 : 60, b.dataset.t); }
    else if (a === "recstop") { if (REC && REC.mr.state === "recording") REC.mr.stop(); }
    else if (a === "play") { if (AUD) AUD.pause(); AUD = new Audio(b.dataset.u); AUD.play().catch(() => toast("No se pudo reproducir")); }
    else if (a === "stk") { if (needLogin()) return; S.st = S.st === id ? null : id; render(); }
    else if (a === "ss") { await API.comment(id, "", b.dataset.u); S.st = null; await refresh(); }
    else if (a === "fadd") { await API.friendReq(b.dataset.id); await refresh(); toast("Solicitud enviada"); }
    else if (a === "facc") { await API.friendAccept(id); await refresh(); toast("Ahora son amigos"); }
    else if (a === "fdel") { await API.friendDel(id); await refresh(); }
    else if (a === "introsave") { if (!S.ia) return toast("Graba o sube un audio primero"); b.disabled = true; const url = await API.upload(S.ia.blob, "wav", "audio/wav"); await API.setIntro(url, +(S.idur || 24)); S.ia = null; await refresh(); toast("Presentación publicada"); }
    else if (a === "introoff") { await API.setIntro(null, 0); await refresh(); toast("Presentación quitada"); }
    else if (a === "rx") { if (needLogin()) return; S.rx = S.rx === id ? null : id; render(); }
    else if (a === "like") { if (needLogin()) return; const k = b.dataset.k2, cur = likesOf(id).find(l => l.user_id === S.me.id), same = cur && (cur.kind || "heart") === k; S.rx = null; S.pop = same ? null : id; await API.like(id, same ? null : k); await refresh(); }
    else if (a === "cm") { S.open[id] = !S.open[id]; render(); }
    else if (a === "send") {
      if (needLogin()) return;
      const t = (S.dr["c" + id] || "").trim(); if (!t) return;
      await API.comment(id, t); S.dr["c" + id] = ""; await refresh();
    }
    else if (a === "prel") { S.pf.rel = b.dataset.v; render(); }
    else if (a === "pc") { S.pf.color = b.dataset.v; render(); }
    else if (a === "pa") { S.pf.avatar = b.dataset.v; S.pf.url = null; S.pf.blob = null; render(); }
    else if (a === "noav") { S.pf.url = null; S.pf.blob = null; render(); }
    else if (a === "psave") {
      let url = S.pf.url; if (S.pf.blob) url = await API.upload(S.pf.blob);
      await API.profile(S.pf.color, S.pf.avatar, url, S.pf.rel); S.pf = null; await refresh(); toast("Perfil guardado");
    }
    else if (a === "del") {
      const k = b.dataset.t + id; if (S.arm !== k) { S.arm = k; render(); return; }
      S.arm = null; b.dataset.t === "c" ? await API.delComment(id) : await API.delMoment(id); await refresh(); toast("Eliminado");
    }
  } catch (err) { toast(err.message || "Algo salió mal"); render(); }
});

document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "u" || e.target.id === "p")) { e.preventDefault(); document.querySelector('[data-a="go"]').click(); } });

(async () => { try { S.me = await API.session(); } catch (e) {} await refresh(); })();
</script>
</body>
</html>
