<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Momentos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#F4F6FB;--card:#fff;--ink:#0B1220;--mut:#6B7790;--line:#E4E8F1;--soft:#EDF1FB;--pri:#2F5BEA;--prid:#2447C7;--onpri:#fff;--bad:#DC2626;--sh:0 1px 2px rgba(11,18,32,.05),0 12px 32px -14px rgba(11,18,32,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0F1C;--card:#121A2B;--ink:#E8EDF7;--mut:#92A0BC;--line:#1F2A40;--soft:#18233A;--pri:#4C74F5;--prid:#9DB4FF;--bad:#F87171;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0A0F1C;--card:#121A2B;--ink:#E8EDF7;--mut:#92A0BC;--line:#1F2A40;--soft:#18233A;--pri:#4C74F5;--prid:#9DB4FF;--bad:#F87171;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--pri),#7C3AED);position:relative;display:block}
.logo::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
h2{margin:24px 0 10px;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
main{max-width:640px;margin:0 auto;padding:10px 16px 120px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--pri) 90%,#fff),var(--pri));color:var(--onpri);border:0;border-radius:14px;padding:11px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 16px -8px color-mix(in srgb,var(--pri) 75%,transparent)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn.bad{background:var(--bad);box-shadow:none}
input,textarea,select{width:100%;font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
input:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent)}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
textarea{resize:none;min-height:84px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;box-shadow:var(--sh)}
.card p{margin:10px 0;font-size:16px;overflow-wrap:anywhere}
.who{display:flex;gap:10px;align-items:center}
.who small{display:block;color:var(--mut);font-size:13px}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:block;object-fit:cover;overflow:hidden;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.av svg{display:block;width:100%;height:100%}
.av.big{width:104px;height:104px;margin:0 auto}
.av.sm{width:32px;height:32px}
.pic{width:100%;max-height:540px;object-fit:cover;border-radius:16px;display:block;margin-top:12px;cursor:zoom-in;background:var(--soft)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.acts button{background:var(--soft);border:1px solid transparent;border-radius:12px;padding:7px 11px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.acts button.on{background:color-mix(in srgb,var(--pri) 14%,var(--card));border-color:var(--pri);color:var(--prid)}
.cms{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.cm{margin:8px 0;overflow-wrap:anywhere}
.cpic{display:block;max-width:230px;width:100%;border-radius:14px;margin-top:6px;cursor:zoom-in}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}.row input{flex:1}
.row .dd{flex:1}.row .ddb{width:100%;justify-content:space-between}
.hero{border:1.5px solid var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 10%,transparent),var(--sh)}
.tag{display:inline-flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--pri) 14%,var(--card));color:var(--prid);border-radius:10px;padding:5px 11px;font-weight:700;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:36px 8px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-weight:600;color:var(--prid)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;z-index:9;background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);display:flex;padding:6px;gap:2px}
nav button{flex:1;position:relative;background:none;border:0;padding:8px 2px;color:var(--mut);font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px}
nav button.on{color:var(--prid);background:color-mix(in srgb,var(--pri) 13%,transparent)}
.dot{position:absolute;top:3px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:11px;font-style:normal;border-radius:999px;min-width:16px;padding:0 4px;line-height:16px;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(8,12,24,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.sheet>div{background:var(--card);width:100%;max-width:440px;border-radius:24px;padding:22px 20px;display:grid;gap:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);max-height:calc(100dvh - 32px);overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0}
.grid button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--mut)}
.sw{width:100%;aspect-ratio:1;max-width:68px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line),0 6px 12px -6px rgba(0,0,0,.35)}
.sel .sw,.sel .av{outline:3px solid var(--ink);outline-offset:3px}
.grid .av{width:100%;max-width:68px;height:auto;aspect-ratio:1}
.chip{font-size:12px;background:color-mix(in srgb,var(--pri) 14%,var(--card));color:var(--prid);border-radius:8px;padding:3px 9px;font-weight:700}
.chip.bad{background:var(--bad);color:#fff}
.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item>div:not(.dd){flex:1;min-width:0;overflow-wrap:anywhere}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover}
.ic{background:none;border:0;color:var(--bad);padding:8px;border-radius:10px;font-weight:600}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:30;display:none;max-width:90%;text-align:center;font-weight:600;box-shadow:var(--sh)}
.prev{position:relative;margin-top:10px}.prev img{width:100%;max-height:240px;object-fit:cover;border-radius:16px}
.prev button{position:absolute;top:8px;right:8px;background:rgba(11,18,32,.75);color:#fff;border:0;border-radius:50%;width:32px;height:32px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:11px;padding:11px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.err{color:var(--bad);font-weight:600;font-size:14px}
.pw{position:relative}.pw input{padding-right:84px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--prid);font-weight:700;padding:8px}
.note-card{display:flex;gap:12px;align-items:center;border-radius:18px;padding:14px;margin-top:12px;color:#fff}
.note-card small{display:block;opacity:.85}.note-card>div{flex:1;min-width:0}
.nt{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.stk{width:96px;height:96px;object-fit:cover;border-radius:16px;display:block;margin-top:4px}
.tray{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding:6px;background:var(--soft);border-radius:16px;scrollbar-width:none;animation:pop .2s ease-out}
.tray::-webkit-scrollbar{display:none}
.tray button{flex:none;min-width:48px;background:none;border:0;border-radius:12px;padding:4px 6px;display:flex;flex-direction:column;align-items:center}
.tray button span{font-size:26px;line-height:1.2;transition:transform .15s}
.tray button small{font-size:11px;color:var(--mut);min-height:14px}
.tray button.on{background:var(--card);box-shadow:inset 0 0 0 2px var(--pri)}
.mini{background:color-mix(in srgb,var(--pri) 14%,var(--card));color:var(--prid);border:0;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;display:inline-flex;gap:5px;align-items:center;margin-left:auto}
.ap{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:999px;padding:6px 14px 6px 6px;margin-top:8px;max-width:340px}
.apb{width:36px;height:36px;border-radius:50%;border:0;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none;padding:0}
.apt{flex:1;height:5px;border-radius:5px;background:color-mix(in srgb,var(--ink) 15%,transparent);overflow:hidden;min-width:60px}
.apt i{display:block;height:100%;width:0;background:var(--pri);border-radius:5px}
.apd{font-size:12px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.ap.w{background:rgba(255,255,255,.2)}.ap.w .apb{background:#fff;color:#1E293B}.ap.w .apt{background:rgba(255,255,255,.3)}.ap.w .apt i{background:#fff}.ap.w .apd{color:#fff}
.dd{position:relative;flex:none}
.ddb{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px}
.ddl{position:absolute;right:0;top:calc(100% + 6px);z-index:15;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);padding:6px;display:grid;gap:2px;animation:pop .15s ease-out}
.ddl.up{top:auto;bottom:calc(100% + 6px)}
.ddl button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:11px;font-weight:600}
.ddl button:hover,.ddl button.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--prid)}
.cbar{display:flex;align-items:center;gap:2px;background:var(--soft);border-radius:999px;padding:4px;margin-top:12px}
.cbar input{flex:1;min-width:0;border:0;background:transparent;box-shadow:none;padding:10px 6px}
.cbar input:focus{box-shadow:none}
.cb{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--mut);display:grid;place-items:center;flex:none;padding:0;cursor:pointer}
.cb.mic,.cb.send{background:var(--pri);color:#fff}
.cbar .send{display:none}.cbar.has .send,.cbar.rec .send{display:grid}.cbar.has .mic{display:none}
.rtime{flex:1;font-weight:700;font-variant-numeric:tabular-nums}
.dotrec{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite;margin:0 8px}
.pnl{background:var(--soft);border-radius:18px;margin-top:8px;padding:10px;max-height:240px;overflow:auto;animation:pop .2s ease-out}
.pt{font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:4px 2px 8px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.pg.e{grid-template-columns:repeat(8,1fr);gap:2px}
.em{background:none;border:0;font-size:24px;padding:6px 0;border-radius:10px}.em:active{background:var(--card)}
.st{aspect-ratio:1;border:0;background:var(--card);border-radius:14px;padding:0;overflow:hidden;display:grid;place-items:center}
.st img{width:100%;height:100%;object-fit:cover}
.st.add{color:var(--prid);border:1.5px dashed var(--pri);background:transparent}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes blink{50%{opacity:.25}}
.go .card,.go .item,.go .empty{animation:up .4s ease-out both}
.go .card:nth-child(2){animation-delay:.06s}.go .card:nth-child(3){animation-delay:.12s}.go .card:nth-child(4){animation-delay:.18s}.go .card:nth-child(n+5){animation-delay:.24s}
.sheet{animation:fade .2s}.sheet>div{animation:slide .28s cubic-bezier(.2,.9,.3,1)}
#toast{animation:tin .22s ease-out}
button,label.btn{transition:transform .12s,background .2s,color .2s,box-shadow .2s,border-color .2s}
button:active:not(:disabled),label.btn:active{transform:scale(.96)}
.pw button:active:not(:disabled){transform:translateY(-50%)}
.acts button.bump{animation:bump .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  c.getContext("2d").drawImage(img, (256 - w) / 2, (256 - h) / 2, w, h); URL.revokeObjectURL(url);

}

document.addEventListener("click", async e => {

    else if (a === "pickav") $("#fa").click();
    else if (a === "noimg") { S.img = null; render(); }
    else if (a === "post") {
      const t = (S.dr.post || "").trim(); if (!t && !S.img && !S.aud) return toast("Escribe algo o agrega una foto o un audio");
      b.disabled = true; const url = S.img ? await API.upload(S.img.blob) : null;
      let ex = null;
      if (S.aud) ex = { kind: S.aud.kind, audio_title: S.aud.kind === "music" ? (S.dr.mt || "Mi canción").slice(0, 60) : null, audio_url: await API.upload(S.aud.blob, "wav", "audio/wav") };
      await API.post(t, url, ex); S.dr.post = ""; S.dr.mt = ""; S.img = null; S.aud = null; await refresh(); toast("Momento publicado");
    }
    else if (a === "pgsend") { S.pgto = b.dataset.id; S.err = null; render(); }
    else if (a === "pgx") { S.pgto = null; S.err = null; render(); }
    else if (a === "pgsend2") {
      const t = (S.dr.pgt || "").trim(); if (!t) { S.err = "Escribe un mensaje"; return render(); }
      try { await API.pigeonSend(S.pgto, t); } catch (e) { S.err = e.message; return render(); }
      S.pgto = null; S.dr.pgt = ""; S.err = null; await refresh(); toast(API.demo ? "La paloma salió volando. Llegará en 1 minuto (demo)." : "La paloma salió volando. Llegará en 1 día.");
    }
    else if (a === "pread") { S.pgo[id] = true; await API.pigeonSeen(id); await refresh(); }
    else if (a === "noaud") { S.aud = null; render(); }
    else if (a === "rec") { if (needLogin()) return; await startRec(b.dataset.t === "intro" ? 30 : 60, b.dataset.t); }
    else if (a === "recstop") { if (REC && REC.mr.state === "recording") REC.mr.stop(); }
    else if (a === "play" || a === "aplay") playUrl(b.dataset.u);
    else if (a === "pan") { if (needLogin()) return; S.cp = S.cp && S.cp.id === id && S.cp.p === b.dataset.p ? null : { id, p: b.dataset.p }; render(); }
    else if (a === "emo") { S.dr["c" + id] = (S.dr["c" + id] || "") + b.dataset.e; render(); }
    else if (a === "cimg") { S.cfor = id; }
    else if (a === "recsend") { if (REC && REC.mr.state === "recording") REC.mr.stop(); }
    else if (a === "crc") { if (REC) { REC.cancel = true; if (REC.mr.state === "recording") REC.mr.stop(); } }
    else if (a === "dd") { S.dd = S.dd === b.dataset.d ? null : b.dataset.d; render(); }
    else if (a === "ddo") {
      const [kind, ref] = b.dataset.d.split(":"), v = b.dataset.v; S.dd = null;
      if (kind === "st") { await API.setStatus(ref, v); await refresh(); toast("Perfil actualizado"); }
      else if (kind === "pin") { await API.pin(+ref, +v); await refresh(); toast(+v ? "Momento fijado" : "Fijado quitado"); }
      else { S.idur = v; render(); }
    }
    else if (a === "ss") { await API.comment(id, "", b.dataset.u); S.cp = null; await refresh(); }
    else if (a === "fadd") { await API.friendReq(b.dataset.id); await refresh(); toast("Solicitud enviada"); }
    else if (a === "facc") { await API.friendAccept(id); await refresh(); toast("Ahora son amigos"); }
    else if (a === "fdel") { await API.friendDel(id); await refresh(); }
    else if (a === "introsave") { if (!S.ia) return toast("Graba o sube un audio primero"); b.disabled = true; const url = await API.upload(S.ia.blob, "wav", "audio/wav"); await API.setIntro(url, +(S.idur || 24)); S.ia = null; await refresh(); toast("Presentación publicada"); }
    else if (a === "introoff") { await API.setIntro(null, 0); await refresh(); toast("Presentación quitada"); }
    else if (a === "rx") { if (needLogin()) return; S.rx = S.rx === id ? null : id; render(); }
    else if (a === "like") { if (needLogin()) return; const k = b.dataset.k2, cur = likesOf(id).find(l => l.user_id === S.me.id), same = cur && (cur.kind || "heart") === k; S.rx = null; S.pop = same ? null : id; await API.like(id, same ? null : k); await refresh(); }
    else if (a === "cm") { S.open[id] = !S.open[id]; render(); }
    else if (a === "send") {
      if (needLogin()) return;
      const t = (S.dr["c" + id] || "").trim(); if (!t) return;
      await API.comment(id, t); S.dr["c" + id] = ""; S.cp = null; await refresh();
    }
    else if (a === "prel") { S.pf.rel = b.dataset.v; render(); }
    else if (a === "pc") { S.pf.color = b.dataset.v; render(); }
    else if (a === "pa") { S.pf.avatar = b.dataset.v; S.pf.url = null; S.pf.blob = null; render(); }
    else if (a === "noav") { S.pf.url = null; S.pf.blob = null; render(); }
    else if (a === "psave") {
      let url = S.pf.url; if (S.pf.blob) url = await API.upload(S.pf.blob);
      await API.profile(S.pf.color, S.pf.avatar, url, S.pf.rel); S.pf = null; await refresh(); toast("Perfil guardado");
    }
    else if (a === "del") {
      const k = b.dataset.t + id; if (S.arm !== k) { S.arm = k; render(); return; }
      S.arm = null; b.dataset.t === "c" ? await API.delComment(id) : await API.delMoment(id); await refresh(); toast("Eliminado");
    }
  } catch (err) { toast(err.message || "Algo salió mal"); render(); }
});

document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const t = e.target;
  if (t.id === "u" || t.id === "p") { e.preventDefault(); document.querySelector('[data-a="go"]').click(); }
  else if (/^c\d+$/.test(t.dataset.k || "")) { e.preventDefault(); const bt = document.querySelector('[data-a="send"][data-id="' + t.dataset.k.slice(1) + '"]'); if (bt) bt.click(); }
});

(async () => { try { S.me = await API.session(); } catch (e) {} await refresh(); })();
</script>
</body>
</html>
