<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#F8FAFC;--card:#fff;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--soft:#E8EEF9;--pri:#2563EB;--prid:#1D4ED8;--onpri:#fff;--bad:#DC2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#111B2E;--ink:#E2E8F0;--mut:#94A3B8;--line:#1E293B;--soft:#1A2640;--pri:#3B82F6;--prid:#93C5FD;--bad:#F87171}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#111B2E;--ink:#E2E8F0;--mut:#94A3B8;--line:#1E293B;--soft:#1A2640;--pri:#3B82F6;--prid:#93C5FD;--bad:#F87171}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em}
h2{margin:20px 0 10px;font-size:19px;font-weight:800;letter-spacing:-.01em}
main{max-width:640px;margin:0 auto;padding:12px 16px 100px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--prid);border:1.5px solid var(--line)}
.btn.bad{background:var(--bad)}
input,textarea,select{width:100%;font-size:16px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
textarea{resize:none;min-height:80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}
.card p{margin:10px 0;font-size:16px;overflow-wrap:anywhere}
.who{display:flex;gap:10px;align-items:center}
.who small{display:block;color:var(--mut)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:block;object-fit:cover;overflow:hidden}
.av svg{display:block;width:100%;height:100%}
.av.big{width:104px;height:104px;margin:0 auto}
.av.sm{width:32px;height:32px}
.pic{width:100%;max-height:520px;object-fit:cover;border-radius:12px;display:block;margin-top:10px;cursor:zoom-in;background:var(--soft)}
.acts{display:flex;gap:8px}
.acts button{background:var(--soft);border:0;border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.acts button.on{background:var(--pri);color:var(--onpri)}
.cms{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.cm{margin:6px 0;overflow-wrap:anywhere}
.row{display:flex;gap:8px;margin-top:8px;align-items:center}.row input{flex:1}
.hero{border:2px solid var(--pri)}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--pri);color:var(--onpri);border-radius:8px;padding:4px 10px;font-weight:600;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:32px 8px}
.note{background:var(--soft);border-radius:12px;padding:12px;font-weight:600;color:var(--prid)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:7px 2px;color:var(--mut);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button.on{color:var(--prid);background:var(--soft)}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0}
.grid button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mut)}
.sw{width:100%;aspect-ratio:1;max-width:68px;border-radius:50%;border:4px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.sel .sw,.sel .av{outline:3px solid var(--ink);outline-offset:2px}
.grid .av{width:100%;max-width:68px;height:auto;aspect-ratio:1}
.chip{font-size:12px;background:var(--soft);color:var(--prid);border-radius:8px;padding:3px 9px;font-weight:600}
.chip.bad{background:var(--bad);color:#fff}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item>div{flex:1;min-width:0;overflow-wrap:anywhere}
.item select{width:auto}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover}
.ic{background:none;border:0;color:var(--bad);padding:8px;border-radius:8px;font-weight:600}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}label.btn{cursor:pointer}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;display:none;max-width:90%;text-align:center}
.prev{position:relative;margin-top:8px}.prev img{width:100%;max-height:240px;object-fit:cover;border-radius:12px}
.prev button{position:absolute;top:8px;right:8px;background:rgba(15,23,42,.75);color:#fff;border:0;border-radius:50%;width:32px;height:32px}
</style>
</head>
<body>
<header><h1>Momentos</h1><div id="bar"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="auth"></div>
<div id="toast"></div>
<input type="file" id="f" accept="image/*" class="vh">
<input type="file" id="fa" accept="image/*" class="vh">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* === CONFIGURACIÓN: pega aquí los datos de Supabase. Vacío = modo demostración (solo en tu navegador) === */
const CFG = { url: "https://tubqwifsrrkfncokmbji.supabase.co/rest/v1/", key: "sb_publishable_ODTlK8Q5KOR8kDW_NblPYQ_UCgDgvNw" };

const COLORS = [["Rojo","#DC2626"],["Naranja","#EA580C"],["Amarillo","#EAB308"],["Verde","#16A34A"],["Azul","#2563EB"],["Morado","#7C3AED"],["Rosa","#DB2777"],["Negro","#1E293B"]];
const AVS = ["a1","a2","a3","a4","a5","a6"];
const STAT = { active: "Activo", muted: "Silenciado", restricted: "Restringido", blocked: "Bloqueado" };
const NOTE = { muted: "Tu cuenta está silenciada: no puedes comentar.", restricted: "Tu cuenta está restringida: no puedes publicar momentos.", blocked: "Tu cuenta está bloqueada: no puedes publicar, comentar ni dar likes." };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cl = c => /^#[0-9a-f]{6}$/i.test(c || "") ? c : COLORS[4][1];
const safe = u => /^(https:\/\/|data:image\/)/.test(u || "") ? esc(u) : "";

const IC = {
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  img: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic = (n, s = 22, f) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

const AX = {
  a1: "",
  a2: '<g fill="none" stroke="@" stroke-width="1.6"><circle cx="20.5" cy="20" r="3"/><circle cx="27.5" cy="20" r="3"/><path d="M23.5 20h1"/></g>',
  a3: '<path d="M15 18a9 9 0 0 1 18 0z" fill="@"/><path d="M30 18h8" stroke="@" stroke-width="2.4" stroke-linecap="round"/>',
  a4: '<path d="M15 21c-1-9 4-13 9-13s10 4 9 13c-1-5-4-7-9-7s-8 2-9 7z" fill="@"/>',
  a5: '<path d="M14 21a10 10 0 0 1 20 0" fill="none" stroke="@" stroke-width="2.4"/><rect x="12" y="19" width="4" height="7" rx="2" fill="@"/><rect x="32" y="19" width="4" height="7" rx="2" fill="@"/>',
  a6: '<path d="M15 19a9 9 0 0 1 18 0z" fill="@"/><circle cx="24" cy="9.5" r="2.4" fill="@"/>'
};
const avSvg = (id, c) => `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="${c}"/><path d="M8 44c2-9 9-12 16-12s14 3 16 12z" fill="#fff" opacity=".92"/><circle cx="24" cy="20" r="8" fill="#fff"/>${(AX[id] || "").replaceAll("@", c)}</svg>`;
const avatar = (p, cls = "") => safe(p.avatar_url) ? `<img class="av ${cls}" src="${safe(p.avatar_url)}" alt="">` : `<span class="av ${cls}">${avSvg(p.avatar || "a1", cl(p.color))}</span>`;

async function shrink(file, max, q) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("No se pudo leer esa imagen")); i.src = url; });
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", q));
}
const toData = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });

function mkDemo() {
  const K = "momentos_demo2"; let s;
  try { s = JSON.parse(localStorage.getItem(K)); } catch (e) {}
  if (!s) {
    const n = Date.now();
    s = { n: 10, me: null, comments: [], likes: [{ moment_id: 1, user_id: "u2" }],
      users: [{ id: "u1", username: "ana_dev", pass: "x", color: "#16A34A", avatar: "a4", status: "active" }, { id: "u2", username: "admin", pass: "admin123", color: "#7C3AED", avatar: "a2", status: "active", is_admin: true }],
      moments: [{ id: 1, user_id: "u1", text: "Se nos cayó el proyector en plena exposición y nadie dijo nada", created_at: n - 864e5 }, { id: 2, user_id: "u2", text: "Hoy alguien contestó “presente” en el chat equivocado", created_at: n - 36e5 }] };
  }
  const save = () => { try { localStorage.setItem(K, JSON.stringify(s)); } catch (e) { throw new Error("El modo demo se quedó sin espacio"); } };
  const find = n => s.users.find(u => u.username.toLowerCase() === n.toLowerCase());
  const meU = () => s.users.find(u => u.id === s.me);
  const deny = () => { throw new Error("Tu cuenta no tiene permiso para esto"); };
  return {
    demo: true,
    async session() { const u = meU(); return u ? { id: u.id, username: u.username } : null; },
    async signUp(n, p) { if (find(n)) throw new Error("Ese nombre ya existe"); const u = { id: "u" + (++s.n), username: n, pass: p, color: COLORS[4][1], avatar: "a1", status: "active" }; s.users.push(u); s.me = u.id; save(); },
    async signIn(n, p) { const u = find(n); if (!u || u.pass !== p) throw new Error("Usuario o contraseña incorrectos"); s.me = u.id; save(); },
    async signOut() { s.me = null; save(); },
    async load() { return { profiles: Object.fromEntries(s.users.map(u => [u.id, u])), moments: s.moments, likes: s.likes, comments: s.comments }; },
    async upload(b) { return toData(b); },
    async post(t, img) { if (["restricted", "blocked"].includes(meU().status)) deny(); s.moments.push({ id: ++s.n, user_id: s.me, text: t, image_url: img || null, created_at: Date.now() }); save(); },
    async like(id, on) { if (meU().status === "blocked") deny(); s.likes = s.likes.filter(l => !(l.moment_id === id && l.user_id === s.me)); if (on) s.likes.push({ moment_id: id, user_id: s.me }); save(); },
    async comment(id, t) { if (["muted", "blocked"].includes(meU().status)) deny(); s.comments.push({ id: ++s.n, moment_id: id, user_id: s.me, text: t, created_at: Date.now() }); save(); },
    async profile(color, av, url) { const u = meU(); u.color = color; u.avatar = av; u.avatar_url = url || null; save(); },
    async setStatus(id, st) { s.users.find(u => u.id === id).status = st; save(); },
    async delComment(id) { s.comments = s.comments.filter(c => c.id !== id); save(); },
    async delMoment(id) { s.moments = s.moments.filter(m => m.id !== id); s.likes = s.likes.filter(l => l.moment_id !== id); s.comments = s.comments.filter(c => c.moment_id !== id); save(); }
  };
}

function mkSup() {
  const sb = supabase.createClient(CFG.url, CFG.key);
  const mail = n => n.toLowerCase() + "@momentos.app";
  const fail = e => { if (e) { const m = e.message || ""; throw new Error(/already/i.test(m) ? "Ese nombre ya existe" : /invalid login/i.test(m) ? "Usuario o contraseña incorrectos" : /at least/i.test(m) ? "La contraseña necesita mínimo 6 caracteres" : /row-level security|permission/i.test(m) ? "Tu cuenta no tiene permiso para esto" : m); } };
  const ok = r => { fail(r.error); return r.data; };
  const t = r => ({ ...r, created_at: Date.parse(r.created_at) });
  return {
    demo: false,
    async session() { const { data } = await sb.auth.getSession(); const u = data.session && data.session.user; return u ? { id: u.id, username: u.user_metadata.username } : null; },
    async signUp(n, p) { const r = await sb.auth.signUp({ email: mail(n), password: p, options: { data: { username: n } } }); fail(r.error); if (!r.data.session) throw new Error("Falta desactivar Confirm email en Supabase"); },
    async signIn(n, p) { fail((await sb.auth.signInWithPassword({ email: mail(n), password: p })).error); },
    async signOut() { await sb.auth.signOut(); },
    async load() {
      const [a, b, c, d] = await Promise.all([sb.from("profiles").select("*"), sb.from("moments").select("*").order("created_at", { ascending: false }).limit(300), sb.from("likes").select("*"), sb.from("comments").select("*").order("created_at")]);
      return { profiles: Object.fromEntries(ok(a).map(u => [u.id, u])), moments: ok(b).map(t), likes: ok(c), comments: ok(d).map(t) };
    },
    async upload(b) { const me = await this.session(), path = me.id + "/" + Date.now() + ".jpg"; fail((await sb.storage.from("media").upload(path, b, { contentType: "image/jpeg" })).error); return sb.storage.from("media").getPublicUrl(path).data.publicUrl; },
    async post(x, img) { fail((await sb.from("moments").insert({ text: x, image_url: img || null })).error); },
    async like(id, on) { fail((on ? await sb.from("likes").insert({ moment_id: id }) : await sb.from("likes").delete().eq("moment_id", id)).error); },
    async comment(id, x) { fail((await sb.from("comments").insert({ moment_id: id, text: x })).error); },
    async profile(color, av, url) { const me = await this.session(); fail((await sb.from("profiles").update({ color, avatar: av, avatar_url: url || null }).eq("id", me.id)).error); },
    async setStatus(id, st) { fail((await sb.rpc("admin_set_status", { target: id, new_status: st })).error); },
    async delComment(id) { fail((await sb.from("comments").delete().eq("id", id)).error); },
    async delMoment(id) { fail((await sb.from("moments").delete().eq("id", id)).error); }
  };
}

const API = (CFG.url && CFG.key && window.supabase) ? mkSup() : mkDemo();
let S = { tab: "home", data: { profiles: {}, moments: [], likes: [], comments: [] }, me: null, open: {}, auth: null, dr: {}, pf: null, img: null, lb: null, arm: null };

function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2800); }
function ago(t) { const m = Math.max(0, (Date.now() - t) / 6e4); if (m < 1) return "ahora"; if (m < 60) return "hace " + Math.floor(m) + " min"; if (m < 1440) return "hace " + Math.floor(m / 60) + " h"; return "hace " + Math.floor(m / 1440) + " d"; }
const likesOf = id => S.data.likes.filter(l => l.moment_id === id);
const meP = () => (S.me && S.data.profiles[S.me.id]) || {};
const isAdmin = () => !!meP().is_admin;
const pOf = id => S.data.profiles[id] || { username: "anónimo", color: COLORS[4][1], avatar: "a1" };
const visible = uid => isAdmin() || pOf(uid).status !== "blocked";

function card(m, hero) {
  const p = pOf(m.user_id), L = likesOf(m.id), liked = S.me && L.some(l => l.user_id === S.me.id);
  const C = S.data.comments.filter(c => c.moment_id === m.id && visible(c.user_id)), o = S.open[m.id];
  const cms = o ? `<div class="cms">${C.map(c => { const q = pOf(c.user_id); return `<div class="cm"><b style="color:${cl(q.color)}">${esc(q.username)}</b> ${esc(c.text)}</div>`; }).join("") || '<div class="cm" style="color:var(--mut)">Sin comentarios todavía</div>'}<div class="row"><input data-k="c${m.id}" value="${esc(S.dr["c" + m.id] || "")}" placeholder="Escribe un comentario" maxlength="200"><button class="btn" data-a="send" data-id="${m.id}">Enviar</button></div></div>` : "";
  return `<article class="card ${hero ? "hero" : ""}">${hero ? `<span class="tag">${ic("trophy", 16)}${hero}</span>` : ""}<div class="who" ${hero ? 'style="margin-top:10px"' : ""}>${avatar(p)}<div><b style="color:${cl(p.color)}">${esc(p.username)}</b><small>${ago(m.created_at)}</small></div></div>${safe(m.image_url) ? `<img class="pic" loading="lazy" alt="Foto del momento" src="${safe(m.image_url)}" data-a="lb" data-u="${safe(m.image_url)}">` : ""}${m.text ? `<p>${esc(m.text)}</p>` : '<div style="height:10px"></div>'}<div class="acts"><button class="${liked ? "on" : ""}" data-a="like" data-id="${m.id}">${ic("heart", 18, liked)}${L.length}</button><button data-a="cm" data-id="${m.id}">${ic("chat", 18)}${C.length}</button></div>${cms}</article>`;
}

function home() {
  const st = meP().status || "active";
  const comp = !S.me
    ? `<div class="card" style="text-align:center"><p style="margin:0 0 12px">Crea tu cuenta para publicar, dar likes y comentar.</p><button class="btn" data-a="auth" data-m="up">Crear cuenta</button></div>`
    : (st === "restricted" || st === "blocked")
      ? `<div class="note">${NOTE[st]}</div>`
      : `<div class="card"><textarea data-k="post" maxlength="280" placeholder="Cuenta un momento divertido…">${esc(S.dr.post || "")}</textarea>${S.img ? `<div class="prev"><img src="${esc(S.img.prev)}" alt="Vista previa"><button data-a="noimg" aria-label="Quitar foto">${ic("x", 16)}</button></div>` : ""}<div class="row" style="justify-content:space-between"><label class="btn ghost" for="f" role="button">${ic("img", 18)}Foto</label><button class="btn" data-a="post">Publicar</button></div>${st === "muted" ? `<div class="note" style="margin-top:10px">${NOTE.muted}</div>` : ""}</div>`;
  const ms = S.data.moments.filter(m => visible(m.user_id)).sort((a, b) => b.created_at - a.created_at);
  return comp + (ms.map(m => card(m)).join("") || '<div class="empty">Aún no hay momentos. Publica el primero.</div>');
}

function rank(title, span) {
  const from = span ? Date.now() - span : 0;
  const ms = S.data.moments.filter(m => m.created_at >= from && visible(m.user_id)).sort((a, b) => likesOf(b.id).length - likesOf(a.id).length || b.created_at - a.created_at);
  if (!ms.length) return `<h2>${title}</h2><div class="empty">${span ? "Esta semana todavía no hay momentos." : "Todavía no hay momentos."}</div>`;
  return `<h2>${title}</h2>` + card(ms[0], span ? "De la semana" : "Destacado") + (ms.length > 1 ? `<h2>Más votados</h2>` + ms.slice(1, 6).map(m => card(m)).join("") : "");
}

function prof() {
  if (!S.me) return `<div class="empty"><p>Entra para personalizar tu perfil.</p><button class="btn" data-a="auth" data-m="in">Entrar</button></div>`;
  const p = meP();
  S.pf = S.pf || { color: cl(p.color), avatar: p.avatar || "a1", url: p.avatar_url || null, blob: null };
  const mine = S.data.moments.filter(m => m.user_id === S.me.id), got = mine.reduce((n, m) => n + likesOf(m.id).length, 0);
  const view = { color: S.pf.color, avatar: S.pf.avatar, avatar_url: S.pf.url };
  return `<div class="card" style="text-align:center">${avatar(view, "big")}<h2 style="color:${S.pf.color};margin:12px 0 2px">${esc(S.me.username)}</h2><small style="color:var(--mut)">${mine.length} momentos · ${got} likes recibidos</small></div>
  <h2>Foto de perfil</h2><div class="row"><label class="btn" for="fa" role="button">${ic("img", 18)}Subir mi foto</label>${S.pf.url ? `<button class="btn ghost" data-a="noav">Quitar foto</button>` : ""}</div>
  <h2>Avatar</h2><div class="grid">${AVS.map(a => `<button data-a="pa" data-v="${a}" class="${!S.pf.url && S.pf.avatar === a ? "sel" : ""}">${avatar({ avatar: a, color: S.pf.color })}</button>`).join("")}</div>
  <h2>Color</h2><div class="grid">${COLORS.map(c => `<button data-a="pc" data-v="${c[1]}" class="${S.pf.color === c[1] ? "sel" : ""}"><span class="sw" style="background:${c[1]}"></span>${c[0]}</button>`).join("")}</div>
  <div class="row" style="margin-top:20px"><button class="btn" data-a="psave">Guardar perfil</button><button class="btn ghost" data-a="out">Salir</button></div>`;
}

function del(kind, id) {
  const k = kind + id;
  return `<button class="ic" data-a="del" data-t="${kind}" data-id="${id}" aria-label="Eliminar">${S.arm === k ? "Confirmar" : ic("trash", 20)}</button>`;
}

function admin() {
  if (!isAdmin()) return '<div class="empty">Solo para administradores.</div>';
  const us = Object.values(S.data.profiles).filter(u => u.id !== S.me.id);
  const cms = [...S.data.comments].sort((a, b) => b.created_at - a.created_at).slice(0, 30);
  const ms = [...S.data.moments].sort((a, b) => b.created_at - a.created_at).slice(0, 20);
  return `<h2>Perfiles</h2>` + (us.map(u => `<div class="item">${avatar(u, "sm")}<div><b style="color:${cl(u.color)}">${esc(u.username)}</b> ${u.status !== "active" ? `<span class="chip bad">${STAT[u.status]}</span>` : ""}</div><select data-st="${u.id}" aria-label="Estado de ${esc(u.username)}">${Object.entries(STAT).map(([k, v]) => `<option value="${k}" ${u.status === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>`).join("") || '<div class="empty">Aún no hay otros perfiles.</div>')
    + `<h2>Comentarios</h2>` + (cms.map(c => `<div class="item"><div><b>${esc(pOf(c.user_id).username)}</b>: ${esc(c.text)}</div>${del("c", c.id)}</div>`).join("") || '<div class="empty">Sin comentarios.</div>')
    + `<h2>Momentos</h2>` + (ms.map(m => `<div class="item">${safe(m.image_url) ? `<img class="thumb" alt="" src="${safe(m.image_url)}">` : ""}<div><b>${esc(pOf(m.user_id).username)}</b>: ${esc(m.text || "(solo foto)")}</div>${del("m", m.id)}</div>`).join("") || '<div class="empty">Sin momentos.</div>');
}

function authSheet() {
  const up = S.auth === "up";
  return `<div class="sheet" data-a="close"><div data-stop="1"><h2 style="margin:0">${up ? "Crea tu cuenta" : "Entrar"}</h2><small style="color:var(--mut)">${up ? "Elige un apodo: así te verán los demás. Mejor no uses tu nombre real." : "Usa tu apodo y tu contraseña."}</small><input id="u" placeholder="Apodo (letras, números o _)" autocapitalize="none" autocomplete="username" maxlength="20"><input id="p" type="password" placeholder="Contraseña (mínimo 6)" autocomplete="${up ? "new-password" : "current-password"}"><button class="btn" data-a="go">${up ? "Crear cuenta" : "Entrar"}</button><button class="btn ghost" data-a="auth" data-m="${up ? "in" : "up"}">${up ? "Ya tengo cuenta" : "Crear cuenta nueva"}</button></div></div>`;
}

function render() {
  const p = meP();
  $("#bar").innerHTML = (API.demo ? '<span class="chip">Modo demo</span> ' : "") + (S.me ? `<span style="font-weight:600;display:inline-flex;gap:8px;align-items:center">${avatar(p, "sm")}${esc(S.me.username)}</span>` : '<button class="btn" data-a="auth" data-m="in">Entrar</button>');
  const T = [["home", "home", "Inicio"], ["top", "trophy", "Destacado"], ["week", "cal", "Semana"], ["me", "user", "Perfil"]];
  if (isAdmin()) T.push(["admin", "shield", "Admin"]);
  $("#nav").innerHTML = T.map(t => `<button data-a="tab" data-t="${t[0]}" class="${S.tab === t[0] ? "on" : ""}">${ic(t[1], 22)}${t[2]}</button>`).join("");
  $("#main").innerHTML = S.tab === "home" ? home() : S.tab === "top" ? rank("Momento destacado", 0) : S.tab === "week" ? rank("Momento de la semana", 7 * 864e5) : S.tab === "admin" ? admin() : prof();
  $("#auth").innerHTML = S.auth ? authSheet() : S.lb ? `<div class="sheet" data-a="lbx" style="align-items:center"><img src="${S.lb}" alt="Foto ampliada" style="max-width:96%;max-height:90vh;border-radius:12px"></div>` : "";
}

async function refresh() { try { S.data = await API.load(); } catch (e) { toast(e.message); } render(); }
const needLogin = () => { if (!S.me) { S.auth = "in"; render(); return true; } return false; };

document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.k; if (k) S.dr[k] = e.target.value; });

document.addEventListener("change", async e => {
  const t = e.target;
  try {
    if (t.dataset.st) { await API.setStatus(t.dataset.st, t.value); await refresh(); toast("Perfil actualizado"); }
    else if (t.id === "f" || t.id === "fa") {
      const f = t.files[0]; t.value = ""; if (!f) return;
      const b = await shrink(f, t.id === "f" ? 1280 : 320, .8), d = await toData(b);
      if (t.id === "f") S.img = { blob: b, prev: d }; else { S.pf = S.pf || {}; S.pf.blob = b; S.pf.url = d; }
      render();
    }
  } catch (x) { toast(x.message || "Algo salió mal"); }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  if (b.dataset.a === "close" && e.target.closest("[data-stop]")) return;
  const a = b.dataset.a, id = +b.dataset.id;
  try {
    if (a === "tab") { S.tab = b.dataset.t; S.pf = null; S.arm = null; render(); scrollTo(0, 0); }
    else if (a === "auth") { S.auth = b.dataset.m; render(); }
    else if (a === "close") { S.auth = null; render(); }
    else if (a === "lb") { S.lb = b.dataset.u; render(); }
    else if (a === "lbx") { S.lb = null; render(); }
    else if (a === "go") {
      const u = $("#u").value.trim(), p = $("#p").value;
      if (!/^[A-Za-z0-9_]{3,20}$/.test(u)) return toast("El apodo debe tener 3 a 20 letras, números o _");
      if (p.length < 6) return toast("La contraseña necesita mínimo 6 caracteres");
      S.auth === "up" ? await API.signUp(u, p) : await API.signIn(u, p);
      S.me = await API.session(); S.auth = null; S.pf = null; await refresh(); toast("Bienvenido, " + S.me.username);
    }
    else if (a === "out") { await API.signOut(); S.me = null; S.pf = null; S.tab = "home"; render(); }
    else if (a === "pick") $("#f").click();
    else if (a === "pickav") $("#fa").click();
    else if (a === "noimg") { S.img = null; render(); }
    else if (a === "post") {
      const t = (S.dr.post || "").trim(); if (!t && !S.img) return toast("Escribe algo o agrega una foto");
      b.disabled = true; const url = S.img ? await API.upload(S.img.blob) : null;
      await API.post(t, url); S.dr.post = ""; S.img = null; await refresh(); toast("Momento publicado");
    }
    else if (a === "like") { if (needLogin()) return; await API.like(id, !likesOf(id).some(l => l.user_id === S.me.id)); await refresh(); }
    else if (a === "cm") { S.open[id] = !S.open[id]; render(); }
    else if (a === "send") {
      if (needLogin()) return;
      const t = (S.dr["c" + id] || "").trim(); if (!t) return;
      await API.comment(id, t); S.dr["c" + id] = ""; await refresh();
    }
    else if (a === "pc") { S.pf.color = b.dataset.v; render(); }
    else if (a === "pa") { S.pf.avatar = b.dataset.v; S.pf.url = null; S.pf.blob = null; render(); }
    else if (a === "noav") { S.pf.url = null; S.pf.blob = null; render(); }
    else if (a === "psave") {
      let url = S.pf.url; if (S.pf.blob) url = await API.upload(S.pf.blob);
      await API.profile(S.pf.color, S.pf.avatar, url); S.pf = null; await refresh(); toast("Perfil guardado");
    }
    else if (a === "del") {
      const k = b.dataset.t + id; if (S.arm !== k) { S.arm = k; render(); return; }
      S.arm = null; b.dataset.t === "c" ? await API.delComment(id) : await API.delMoment(id); await refresh(); toast("Eliminado");
    }
  } catch (err) { toast(err.message || "Algo salió mal"); render(); }
});

(async () => { try { S.me = await API.session(); } catch (e) {} await refresh(); })();
</script>
</body>
</html>
